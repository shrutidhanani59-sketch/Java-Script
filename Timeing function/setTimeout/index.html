<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body
        {
            background-color: aquamarine;
            text-align: center;
            justify-content: center;
            padding: 250px;
        }
        div
        {
            background-color: blueviolet;
            padding: 50px;
            color: white;
            font-size: 24px;
            display: none;
        }

    </style>
</head>
<body>
    <div>This is SetTimeout</div>

    <script>
        setTimeout(()=> {
            document.querySelector('div').style.display = "block";
        },5000)
    </script>
    
</body>
</html>
